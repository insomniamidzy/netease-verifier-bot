name: 自動審單機器人 (Netease Verifier)

# 觸發條件：接收來自 Supabase 的 Webhook (event_type: verify_netease_account)
on:
  repository_dispatch:
    types: [verify_netease_account]

jobs:
  verify-account:
    runs-on: ubuntu-latest # 使用 GitHub 免費提供的 Linux 伺服器
    
    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4

      - name: ⚙️ 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 安裝必備套件
        run: npm install puppeteer @supabase/supabase-js

      - name: 🚀 啟動無頭瀏覽器執行審核
        env:
          # 從 GitHub Secrets 安全讀取金鑰
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # 從 Supabase 傳來的 payload 讀取訂單資訊
          ORDER_ID: ${{ github.event.client_payload.order_id }}
          ORDER_NO: ${{ github.event.client_payload.order_no }}
          TARGET_UID: ${{ github.event.client_payload.uid }}
          TARGET_SERVER: ${{ github.event.client_payload.server }}
        run: node verifier.js